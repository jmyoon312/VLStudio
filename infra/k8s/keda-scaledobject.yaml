# --- Phase 3: KEDA ScaledObject (Elastic Worker Scaling) ---
# This manifest tells Kubernetes to scale the worker pods based on the queue length.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: openclaw-worker-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: openclaw-worker # References the worker Deployment
  minReplicaCount: 0      # Scale to ZERO when no work (Cost optimization)
  maxReplicaCount: 300    # Maximum agents per cluster (Scale-out goal)
  pollingInterval: 30     # How often to check RabbitMQ (seconds)
  cooldownPeriod:  300    # How long to wait before scaling down (seconds)
  triggers:
    - type: rabbitmq
      metadata:
        queueName: openclaw_missions
        queueLength: "1"  # Scale 1 POD per 1 MISSION (1:1 scaling)
        host: amqp://guest:guest@rabbitmq.default.svc.cluster.local:5672/
