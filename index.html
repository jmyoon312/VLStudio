<!doctype html>
<html lang="ko" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ViraLoop" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <title>ViraLoop Studio - AI 기반 바이럴 숏폼 제작 & 다채널 자동화 솔루션</title>
  <meta name="description" content="AI 기반 바이럴 숏폼 소재 발굴, 자동 제작 및 다채널 배포 자동화 솔루션" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang&family=Gowun+Dodum&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=Sunflower:wght@300;500;700&display=swap"
    rel="stylesheet">
  <!-- Web Fonts CDN (Fallback for Electron and local environments) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.css" />

  <!-- Global Browser Safe Polyfill (Must execute before any ESM module evaluation) -->
  <script>
    if (typeof window !== 'undefined' && typeof window.electronAPI === 'undefined') {
      window.__IS_WEB_BROWSER__ = true;
      const baseMock = {
        isMock: true,
        loadProfiles: async () => ({ activeProfileId: 'default', profiles: [{ id: 'default', name: '기본 프로필' }] }),
        getSavedWorkFolder: async () => ({ success: true, path: '', name: '' }),
        getDefaultWorkFolder: async () => ({ success: true, path: '', name: '' }),
        listProjects: async () => ({ projects: [] }),
        getHistory: async () => ({ success: true, histories: [] }),
        getActiveViews: async () => ({ views: [] }),
        loadStyleThumbnails: async () => ({ success: true, thumbnails: {} }),
        checkStyleThumbnails: async () => ({ success: true, thumbnails: {} }),
        onFlowStatus: () => () => {},
        onLayoutChanged: () => () => {},
        onMenuAction: () => () => {},
        onStoryEvent: () => () => {},
        onMcpUpdate: () => () => {},
      };
      window.electronAPI = new Proxy(baseMock, {
        get(target, prop) {
          if (prop in target) return target[prop];
          if (typeof prop === 'string' && prop.startsWith('on')) return () => () => {};
          return async () => ({ success: true, isMock: true });
        }
      });
    }
  </script>
</head>

<body class="bg-[#F8F9FC] select-none touch-manipulation">
  <div id="root"></div>
  <script type="module" src="/apps/dashboard/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('[PWA] SW register skipped:', err);
        });
      });
    }
  </script>
</body>

</html>
