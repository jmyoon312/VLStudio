name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pyinstaller

      - name: Build MCP Server Dependencies
        run: npm run mcp:install

      - name: Build Standalone Backend Binary (Windows)
        run: python apps/api/dev_utils/build_backend.py

      - name: Build & Package Desktop Application (Windows NSIS Setup.exe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BUILD_TARGET: nsis
          VITE_FUNCTION_ENV: prod
        run: |
          npm run build:prod
          npx electron-builder --win nsis --publish always
